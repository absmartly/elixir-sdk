name: Publish

# Publishes the package (and its docs) to Hex when a version tag is pushed,
# e.g. `git tag v1.0.0 && git push origin v1.0.0`. The tag must match the
# version in mix.exs, which is also the version sent in the X-Agent header.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: mix hex.publish
    runs-on: ubuntu-latest
    environment: hex

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.17"
          otp-version: "26"

      - name: Check the tag matches the mix.exs version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the mix.exs version $version (expected v$version)"
            exit 1
          fi

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      # mix hex.publish uploads the package before it builds the docs, so a
      # docs failure there would leave a release without docs. Build both
      # first so nothing is published unless both succeed.
      - name: Build package
        run: mix hex.build

      - name: Build docs
        run: mix docs

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
